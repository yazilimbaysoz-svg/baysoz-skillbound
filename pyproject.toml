# Baysöz Labs <baysozlabs@proton.me> — baysoz-skillbound
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "baysoz-skillbound"
version = "0.1.0"
description = "Offline AI agent skill-bundle capability-contract oracle and SARIF CI gate by Baysöz Labs <baysozlabs@proton.me>"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Baysöz Labs", email = "baysozlabs@proton.me" }]
maintainers = [{ name = "Baysöz Labs", email = "baysozlabs@proton.me" }]
keywords = [
  "appsec",
  "redteam",
  "agent-security",
  "supply-chain",
  "sarif",
  "baysöz-labs",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/yazilimbaysoz-svg/baysoz-skillbound"
Issues = "https://github.com/yazilimbaysoz-svg/baysoz-skillbound/issues"
Maintainer = "mailto:baysozlabs@proton.me"

[project.scripts]
skillbound = "skillbound.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skillbound"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
