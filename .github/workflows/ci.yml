# Baysöz Labs <baysozlabs@proton.me> — baysoz-skillbound CI
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install uv and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv ruff semgrep pytest
      - name: Create environment and install package
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest
      - name: Tests
        run: uv run pytest -q
      - name: Ruff static analysis
        run: ruff check --select E,F,W,S,B .
      - name: Semgrep security analysis
        run: semgrep --config p/default --error .
      - name: CLI smoke gate (Baysöz Labs attribution)
        run: |
          uv run skillbound --version
          uv run skillbound rules
